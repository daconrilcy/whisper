[package]
name = "whisper-worker-cpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "../../scripts/recette-build.rs"

[features]
default = []
recette-hooks = []
l01-memory-qualification = ["whisper-worker-common/l01-memory-qualification"]

[dependencies]
whisper-worker-common.workspace = true
whisper-core.workspace = true
serde_json.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
whisper-rs = { version = "=0.16.0", default-features = false }

[lints]
workspace = true
