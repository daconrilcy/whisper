[package]
name = "whisper-adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "../../scripts/recette-build.rs"

[features]
default = []
recette-hooks = []
l01-memory-qualification = []
l3-gpu-qualification = []
personal-qualification = []

[dependencies]
whisper-core.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json.workspace = true
sha2 = "=0.10.9"
same-file = "=1.0.6"
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "pcm", "mp3"] }
cpal = { version = "=0.18.2", default-features = false }
rubato = { version = "=0.16.2", default-features = false, features = ["fft_resampler"] }
webrtc-vad = "=0.4.0"
rtrb = "=0.4.0"
rustfft = "=6.4.1"

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
wmi = "=0.18.4"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Devices_Display", "Win32_Devices_DeviceAndDriverInstallation"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
