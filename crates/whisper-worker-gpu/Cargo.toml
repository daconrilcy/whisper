[package]
name = "whisper-worker-gpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "../../scripts/recette-build.rs"

[features]
default = []
recette-hooks = []
l01-memory-qualification = []

[dependencies]
whisper-core.workspace = true
serde_json.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
whisper-rs = { version = "=0.16.0", default-features = false, features = ["cuda", "raw-api"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "pcm", "mp3"] }
rusty_mp3 = "=0.8.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Devices_Display", "Win32_Devices_DeviceAndDriverInstallation"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
