[workspace]
members = [
    "crates/whisper-core",
    "crates/whisper-adapters",
    "crates/whisper-worker-cpu",
    "crates/whisper-worker-gpu",
    "crates/whisper-desktop",
    "crates/whisper-bootstrap",
]
default-members = [
    "crates/whisper-core",
    "crates/whisper-adapters",
    "crates/whisper-desktop",
    "crates/whisper-bootstrap",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
whisper-core = { path = "crates/whisper-core" }
whisper-adapters = { path = "crates/whisper-adapters" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
